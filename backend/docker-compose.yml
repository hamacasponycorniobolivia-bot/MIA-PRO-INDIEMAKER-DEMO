services:
  postgres:
    image: postgres:15-alpine
    container_name: mia_postgres
    environment:
      POSTGRES_USER: mia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mia_pro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mia_user -d mia_pro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mia_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

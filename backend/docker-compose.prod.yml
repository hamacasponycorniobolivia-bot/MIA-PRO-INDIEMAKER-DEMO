services:
  api:
    build: .
    container_name: mia_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: mia_postgres_prod
    environment:
      POSTGRES_USER: mia
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: mia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mia_redis_prod
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:

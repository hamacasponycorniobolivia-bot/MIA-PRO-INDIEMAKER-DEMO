[build]
  command = "cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev && cd .. && ln -sfn backend/node_modules node_modules"
  publish = "frontend/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["otplib", "@otplib/plugin-base32-scure", "@scure/base"]

[build.environment]
  NODE_VERSION = "22"

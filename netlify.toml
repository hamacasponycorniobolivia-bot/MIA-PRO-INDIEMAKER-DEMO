[build]
  base = "frontend"
  command = "npm run build && cd ../backend && npm ci --omit=dev"
  publish = "dist"
  functions = "../netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[functions]
  node_bundler = "esbuild"
  external_node_modules = ["otplib", "@otplib/plugin-base32-scure", "@scure/base", "bcrypt"]

[build.environment]
  NODE_VERSION = "22"
